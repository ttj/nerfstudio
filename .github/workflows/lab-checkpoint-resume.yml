name: CPU checkpoint resume contract

on:
  pull_request:
    branches: [py314-cuda13]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-resume:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU contract dependencies only
        run: |
          python -m pip install 'torch>=2.9,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10'
      - name: Exercise actual checkpoint/model method sources on CPU
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -m pytest tests/engine/test_checkpoint_optimizer_binding.py -q -o addopts=''
